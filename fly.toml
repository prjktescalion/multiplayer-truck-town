# Fly app names are globally unique, and this becomes the hostname players connect to.
# Change it before the first deploy, then set the repo variable RELAY_URL to wss://<app>.fly.dev.
app = "truck-town"
# Newark. Fly deprecated the Boston region; ewr is the closest remaining one, about 5-10 ms away,
# which is immaterial next to the ~30 Hz replication rate.
primary_region = "ewr"

[build]
dockerfile = "Dockerfile"

[[services]]
internal_port = 8910
protocol = "tcp"
# Keep the machine warm. A cold start would drop the first player's connection attempt.
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[services.ports]]
port = 443
handlers = ["tls", "http"]

[[services.ports]]
port = 80
handlers = ["http"]

[[vm]]
size = "shared-cpu-1x"
# The relay forwards transforms and simulates no physics, so the smallest tier is plenty.
# This is also the cheapest configuration Fly offers, at roughly $2/month running continuously.
memory = "256mb"
