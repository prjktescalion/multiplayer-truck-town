app = "truck-town"
# Boston, to keep latency low at the table.
primary_region = "bos"

[build]
dockerfile = "Dockerfile"

[[services]]
internal_port = 8910
protocol = "tcp"
# Keep the machine warm. A cold start would drop the first player's connection attempt.
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[services.ports]]
port = 443
handlers = ["tls", "http"]

[[services.ports]]
port = 80
handlers = ["http"]

[[vm]]
size = "shared-cpu-1x"
# The server relays transforms and simulates no physics, so this is generous.
memory = "512mb"
